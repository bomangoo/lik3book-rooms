name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # 실시간 서버를 따로 띄웠다면 저장소 Settings → Variables 에 WS_URL(wss://.../ws)을 넣으세요.
          VITE_WS_URL: ${{ vars.WS_URL }}
          # Pages 에는 실시간 서버가 없으므로, WS_URL 이 없으면 혼자 모드로 (사용자 도메인에서도)
          VITE_STATIC_HOST: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
